[project]
name = "zo-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "attrs>=25.3.0",
    "datasets>=3.6.0",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.5",
    "numpy>=2.2.6",
    "pandas>=2.3.0",
    "peft>=0.15.2",
    "pytest>=9.0.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "tensorboardx>=2.6.4",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "transformers[torch]>=4.53.0",
]

[dependency-groups]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
